name: Release (Windows on-prem installer)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (no leading v), e.g. 0.1.0-rc.1"
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.0"
  TAURI_CLI_VERSION: "2.12.4"
  # Bump when a new PostgreSQL 16 minor ships; set PG_SHA256 to verify the download.
  PG_VERSION: "16.10-1"
  PG_SHA256: ""
  HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}

defaults:
  run:
    shell: pwsh

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Version '$v' is not semver" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # ---- on-prem payload ------------------------------------------------------
      - name: Build web (onprem)
        run: |
          $env:VITE_EDITION = 'onprem'
          pnpm --filter @erp/web exec vite build --outDir dist-onprem
      - name: Bundle server (onprem)
        run: node apps/server/build.onprem.mjs
      - name: Install native server deps for win32 (argon2 prebuilds)
        working-directory: apps/server/dist-onprem
        run: npm install --omit=dev --no-audit --no-fund --no-package-lock
      - name: On-prem guard (source graph + bundles)
        run: |
          node scripts/check-onprem.mjs --source
          node scripts/check-onprem.mjs apps/server/dist-onprem apps/web/dist-onprem

      - name: Fetch Node, PostgreSQL and WinSW for Windows
        run: ./apps/installer/scripts/fetch-deps.ps1 -OutDir apps/installer/build -PgVersion $env:PG_VERSION -PgSha256 $env:PG_SHA256

      - name: Stage server and web
        run: |
          Copy-Item apps/server/dist-onprem apps/installer/build/server -Recurse -Force
          Copy-Item apps/web/dist-onprem apps/installer/build/web -Recurse -Force

      # ---- client app (Tauri) ---------------------------------------------------
      - name: Build Tauri client
        working-directory: apps/desktop
        run: |
          @{ version = '${{ steps.ver.outputs.version }}' } | ConvertTo-Json | Set-Content tauri.release.json
          npx --yes "@tauri-apps/cli@$env:TAURI_CLI_VERSION" build --config tauri.release.json
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Tauri NSIS bundle not found' }
          New-Item -ItemType Directory -Force ../installer/build/client | Out-Null
          Copy-Item $exe.FullName ../installer/build/client/SCG-Shop-ERP-Client-Setup.exe

      # ---- code signing (skipped when the secret is absent) -------------------
      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          "SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
      - name: Sign client setup
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:SIGN_PFX /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 apps/installer/build/client/SCG-Shop-ERP-Client-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
      - name: Signing skipped
        if: env.HAS_SIGNING_CERT != 'true'
        run: Write-Host "::warning::WINDOWS_CERT_PFX_BASE64 not set; installers are UNSIGNED (SmartScreen will warn)."

      # ---- main installer (Inno Setup) -----------------------------------------
      - name: Final on-prem guard over the whole staged payload
        run: node scripts/check-onprem.mjs apps/installer/build

      - name: Compile Inno Setup
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidate = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $candidate)) { choco install innosetup -y --no-progress | Out-Null }
            $iscc = $candidate
          } else { $iscc = $iscc.Source }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" apps/installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

      - name: Sign installer
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:SIGN_PFX /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 apps/installer/Output/SCG-Shop-ERP-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }

      - name: Checksum
        run: |
          $h = (Get-FileHash apps/installer/Output/SCG-Shop-ERP-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  SCG-Shop-ERP-Setup.exe" | Set-Content apps/installer/Output/SCG-Shop-ERP-Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SCG-Shop-ERP-Setup-${{ steps.ver.outputs.version }}
          path: |
            apps/installer/Output/SCG-Shop-ERP-Setup.exe
            apps/installer/Output/SCG-Shop-ERP-Setup.exe.sha256
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: if ($env:SIGN_PFX) { Remove-Item $env:SIGN_PFX -Force -ErrorAction SilentlyContinue }
