<title>SCG Shop ERP Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — fixed sidebar of modules (M01–M13) on wide screens, drawer on phones; work area of cards/tables; modals for actions */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef2f7; --fg:#16202c; --muted:#5b6878; --line:#d9e0e9;
  --accent:#0b5cad; --accent-fg:#ffffff; --accent-soft:#e3eefa;
  --ok:#1d7a4b; --ok-soft:#e2f4ea; --warn:#a15c00; --warn-soft:#fdf0db; --bad:#b4232c; --bad-soft:#fbe6e7;
  --font:"IBM Plex Sans Thai",system-ui,"Noto Sans Thai",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:12px;
  /* one hue per section so people always know where they are */
  --info:#0b5cad; --info-soft:#e3eefa;
  --c-ov:#2563a8; --c-ov-soft:#e5eef9;
  --c-sale:#0e8a5c; --c-sale-soft:#e0f3ea;
  --c-inv:#bf6a06; --c-inv-soft:#fcefdc;
  --c-data:#7447c2; --c-data-soft:#efe9fb;
  --c-sys:#4a5a6c; --c-sys-soft:#e8edf2;
  --c-adm:#b22b4b; --c-adm-soft:#f9e3e8;
  --c-hr:#0f7c8c; --c-hr-soft:#dff3f5;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  /* printed paper keeps one light look in both themes, like a real sheet */
  --paper:#ffffff; --paper-fg:#1b1f24; --paper-muted:#5f6670; --paper-line:#cfd5dc;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e27; --surface2:#1f2833; --fg:#e6ebf1; --muted:#97a3b3; --line:#2c3744;
  --accent:#5aa3ee; --accent-fg:#06121f; --accent-soft:#16304b;
  --ok:#5ccf92; --ok-soft:#133426; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#f2787f; --bad-soft:#3d1a1d; --info:#5aa3ee; --info-soft:#16304b; --c-ov:#6ea8ef; --c-ov-soft:#16293f; --c-sale:#4fd09a; --c-sale-soft:#10301f; --c-inv:#f2a64b; --c-inv-soft:#3a2810; --c-data:#b393f2; --c-data-soft:#2a2043; --c-sys:#a3b3c5; --c-sys-soft:#202833; --c-adm:#f27f99; --c-adm-soft:#3d1822; --c-hr:#56c8d6; --c-hr-soft:#10303a; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --surface2:#1f2833; --fg:#e6ebf1; --muted:#97a3b3; --line:#2c3744;
  --accent:#5aa3ee; --accent-fg:#06121f; --accent-soft:#16304b;
  --ok:#5ccf92; --ok-soft:#133426; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#f2787f; --bad-soft:#3d1a1d; --info:#5aa3ee; --info-soft:#16304b; --c-ov:#6ea8ef; --c-ov-soft:#16293f; --c-sale:#4fd09a; --c-sale-soft:#10301f; --c-inv:#f2a64b; --c-inv-soft:#3a2810; --c-data:#b393f2; --c-data-soft:#2a2043; --c-sys:#a3b3c5; --c-sys-soft:#202833; --c-adm:#f27f99; --c-adm-soft:#3d1822; --c-hr:#56c8d6; --c-hr-soft:#10303a; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:12px}
.navgrp{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding:12px 8px 4px}
.nav button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .code{font-family:var(--mono);font-size:11px;color:var(--muted)}
.nav .cnt{background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:0 7px;font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top h1{font-size:18px;margin:0;text-wrap:balance}
.top .mcode{font-family:var(--mono);font-size:12px;color:var(--muted)}
.top .sp{flex:1}
.btn.menu-btn{display:none}
.perm td,.perm th{text-align:center;white-space:nowrap}.perm td:first-child,.perm th:first-child{text-align:left;white-space:normal;min-width:200px}.perm .grp td{background:var(--surface2);font-weight:600;text-align:left}
.pcell{border:0;background:none;cursor:pointer;padding:0}.pcell:disabled{cursor:default}
.mockbar{font-size:12px;background:var(--warn-soft);color:var(--warn);padding:6px 16px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.content{padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .s{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tw{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-acc{background:var(--info-soft);color:var(--info)}.p-mut{background:var(--surface2);color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
input.qty{width:80px;text-align:right}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f > *{color:var(--fg)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{padding:4px 12px;border-radius:99px;background:var(--surface2);color:var(--muted);font-size:13px}
.steps span.on{background:var(--accent);color:var(--accent-fg)}
.steps span.done{background:var(--ok-soft);color:var(--ok)}
.note{background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* POS */
.pos{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile:hover{border-color:var(--accent)}
.tile .im{height:78px;border-radius:8px;background:var(--surface2);display:block;overflow:hidden}
.tile .im svg,.tile .im img,.thumb svg,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb{width:40px;height:40px;border-radius:6px;background:var(--surface2);overflow:hidden;flex:none;display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;white-space:nowrap;font-size:13px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tile .nm{font-weight:500;font-size:13px;line-height:1.35}
.tile .pr{margin-top:auto;font-weight:700;font-variant-numeric:tabular-nums}
.cart{position:sticky;top:76px}
.cline{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.cline .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qbtn{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px;font-variant-numeric:tabular-nums;padding-top:8px}
.tot .big{font-size:22px;font-weight:700}
.member{background:var(--surface2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ok-soft);color:var(--ok);padding:4px 10px;border-radius:99px;font-size:13px}
.coupon{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.coupon.ok{border-color:var(--ok)}
.coupon.no{opacity:.6}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(10,16,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.md{background:var(--surface);border-radius:14px;width:min(640px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.md.wide{width:min(900px,100%)}
.md h3{margin:0;font-size:17px}
.md .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:calc(100% - 32px)}
.paper{background:var(--paper);color:var(--paper-fg);border:1px solid var(--paper-line);border-radius:6px;padding:28px;font-size:12.5px;width:100%;min-width:560px;max-width:794px;margin:0 auto}
.paper.slip{min-width:0;max-width:320px;font-family:var(--mono);font-size:11.5px;padding:14px}
.paper th,.paper td{border-bottom:1px solid var(--paper-line);padding:5px 6px;color:var(--paper-fg)}
.paper th{color:var(--paper-muted)}
.paper .pm{color:var(--paper-muted)}
.paper .ph{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--paper-fg);padding-bottom:10px;margin-bottom:12px}
.paper h4{margin:0;font-size:18px}
.paper .sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:24px;margin-top:40px;text-align:center}
.paper .sig div{border-top:1px solid var(--paper-fg);padding-top:4px}
.paper .plogo{width:52px;height:52px;border-radius:8px;border:1px solid var(--paper-line);display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--paper-muted);flex:none}
.paper .plogoimg{height:52px;max-width:130px;object-fit:contain;flex:none}
.paper .pbaht{text-align:right;margin-top:4px;font-weight:600}
.paper .pbank{margin-top:12px;border:1px solid var(--paper-line);border-radius:6px;padding:8px 10px}
.paper .stamp{width:76px;height:76px;border:1px dashed var(--paper-muted);border-radius:50%;margin:-40px auto 6px;display:grid;place-items:center;color:var(--paper-muted);font-size:11px}
.paper .sig div.stampwrap{border-top:0}
.md h4.sec{margin:6px 0 -6px;font-size:13px;color:var(--muted);font-weight:600;border-top:1px solid var(--line);padding-top:10px}
.logo-box{width:120px;height:64px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden;background:var(--surface)}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain}
.ctrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr)) auto;gap:6px;align-items:end;margin-bottom:6px}
.paper .tots{margin-left:auto;max-width:300px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:8px}
.receipt{font-family:var(--mono);font-size:12px;background:var(--surface2);border-radius:8px;padding:14px;max-width:340px;margin:0 auto;width:100%}
.receipt .c{text-align:center}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt hr{border:0;border-top:1px dashed var(--line);margin:6px 0}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.flowmap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flowmap .box{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);font-size:13px}
.flowmap .arr{color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--font);font-size:11px}
/* ===== visual refresh v2 ===== */
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
table{font-size:13.5px}
td.mono,td.n,th.n{white-space:nowrap}
.top .persona{display:flex;align-items:center;gap:6px}
.top .persona select{max-width:260px}
@media (max-width:700px){.top{flex-wrap:wrap}.top .sp{display:none}.top .persona{order:5;width:100%}.top .persona select{flex:1;max-width:none;min-width:0}.top h1{font-size:17px}}
body[data-mod="ov"]{--accent:var(--c-ov);--accent-soft:var(--c-ov-soft)}
body[data-mod="sale"]{--accent:var(--c-sale);--accent-soft:var(--c-sale-soft)}
body[data-mod="inv"]{--accent:var(--c-inv);--accent-soft:var(--c-inv-soft)}
body[data-mod="data"]{--accent:var(--c-data);--accent-soft:var(--c-data-soft)}
body[data-mod="sys"]{--accent:var(--c-sys);--accent-soft:var(--c-sys-soft)}
body[data-mod="adm"]{--accent:var(--c-adm);--accent-soft:var(--c-adm-soft)}
body[data-mod="hr"]{--accent:var(--c-hr);--accent-soft:var(--c-hr-soft)}
#login .lg{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px;overflow:auto}
#login .lgcard{width:min(440px,100%)}
#login .lgusers{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#login .lgusers .btn{justify-content:flex-start;text-align:left;white-space:normal}
.paper{position:relative}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.pager .btn.sm{min-width:32px;justify-content:center}
.pager .btn.on{background:var(--accent);color:var(--accent-fg,#fff);border-color:var(--accent)}
.pgload{position:relative;opacity:.45;pointer-events:none;transition:opacity .15s}
.sk{height:14px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,var(--line) 25%,var(--surface) 50%,var(--line) 75%);background-size:200% 100%;animation:sk 1.1s infinite linear}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.paper .voidmark{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-16deg);font-size:60px;font-weight:800;color:rgba(200,30,40,.25);border:6px solid rgba(200,30,40,.25);padding:2px 22px;border-radius:12px;pointer-events:none}
.card{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.card h2{font-size:15.5px;font-weight:600;gap:10px}
.side{padding-block:18px}
.brand{padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:6px}
.logo{border-radius:10px;width:38px;height:38px;background:var(--accent);transition:background .2s}
.navgrp{display:flex;align-items:center;gap:8px;letter-spacing:.07em;padding:16px 10px 6px}
.navgrp i{width:8px;height:8px;border-radius:3px;display:inline-block}
.nav button{padding:9px 10px;border-radius:10px;gap:10px;justify-content:flex-start}
.nav button .lbl{flex:1}
.nav .ni{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.nav .ni svg{width:17px;height:17px}
.nav button.on{color:var(--fg)}
.nav button.on .lbl{font-weight:600}
.nav button.on .ni{color:#fff!important}
.top{gap:14px;box-shadow:var(--shadow);border-bottom:0}
.top h1{font-size:19px}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 10px;font-family:var(--font);font-weight:600}
.crumb + .mono{margin-left:8px}
.content{gap:18px}
th{background:var(--surface2);position:sticky;top:0}
table tr:first-child th:first-child{border-top-left-radius:8px}table tr:first-child th:last-child{border-top-right-radius:8px}
td{border-bottom-color:color-mix(in srgb,var(--line) 70%,transparent)}
.btn{border-radius:9px}
.btn.pri{box-shadow:0 1px 2px rgba(0,0,0,.12)}
.kpi{position:relative;padding-right:60px}
.kpi .v{font-size:26px;letter-spacing:-.01em}
.kpi .ki{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--k,var(--accent)) 15%,transparent);color:var(--k,var(--accent))}
.kpi .ki svg{width:19px;height:19px}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sc{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .12s,box-shadow .12s}
.sc:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--k)}
.sc .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 15%,transparent);color:var(--k)}
.sc .ic svg{width:18px;height:18px}
.sc b{font-size:14px}.sc span{font-size:12px;color:var(--muted)}
.flowmap .box{border-left:3px solid var(--k,var(--line))}
.tile{border-radius:12px;transition:transform .12s,box-shadow .12s,border-color .12s}

/* below-cost rule: selling price (per base unit, before VAT, after discounts) must not be under system cost. Quotations are exempt. */
function belowCost(lines,mode,billDisc,wh){const sub=lines.reduce((a,l)=>a+lineNet(l),0);const k=sub>0?Math.max(0,1-(+billDisc||0)/sub):1;const out=[];
  lines.forEach(l=>{if(l.bundle&&l.qty>0){const pr=promoOf(l.bundle);if(pr.costOk&&!l.dval)return;const c=bundleCost(pr,wh);let sp=lineNet(l)*k/l.qty;if(mode==='inc')sp/=1.07;if(c>0&&sp<c-0.005)out.push({name:pr.name,sell:r2(sp),cost:r2(c)});return;}
    if(!l.pid||!(l.qty>0))return;const p=P(l.pid);if(!isStk(p))return;if(l.promo&&!l.dval&&(promoOf(l.promo)||{}).costOk)return;const base=l.qty*p.units[l.u||0].f;const c=saleCost(p.id,wh||posWh(),base);if(!(c>0))return;
    let sp=lineNet(l)*k/base;if(mode==='inc'&&p.vatS==='7')sp/=1.07;if(sp<c-0.005)out.push({name:p.name,sell:r2(sp),cost:r2(c)});});return out;}
function guardSale(lines,mode,billDisc,wh,fn){const bc=belowCost(lines,mode,billDisc,wh);if(!bc.length){fn();return;}
  const see=perm('data.cost');const lbl='ขายต่ำกว่าต้นทุน '+bc.length+' รายการ: '+bc.map(b=>see?`${b.name} (ขาย ${fmt(b.sell)} < ทุน ${fmt(b.cost)} ต่อหน่วย ก่อน VAT)`:b.name).join(', ');
  if(perm('sales.belowCost')===1){S.audit.unshift({t:nowT(),who:curUser().name,what:lbl,by:'เจ้าของร้าน (ยืนยันเอง)'});toast('ขายต่ำกว่าทุน '+bc.length+' รายการ · บันทึกใน audit log แล้ว');fn();return;}
  needPerm('sales.belowCost',lbl,fn);}

function cartCalc(){
  let gross=0,scgTotal=0,tigerTotal=0;
  S.cart.forEach(l=>{const t=lineNet(l);gross+=t;if(l.bundle){bundleAlloc(l).forEach(a=>{const p=P(a.pid);if(p.scg)scgTotal+=a.amt;if(p.id==='p1')tigerTotal+=a.amt;});return;}const p=P(l.pid);if(p.scg)scgTotal+=t;if(p.id==='p1')tigerTotal+=t;});
  let cp=0;if(S.coupon){const c=couponObj(S.coupon);cp=c&&c.test({scgTotal,tigerTotal})?Math.min(c.val({scgTotal,tigerTotal}),gross):0;}
  const disc=Math.min(+S.billDisc||0,gross-cp);
  const mode=posMode();const t=calcDoc(S.cart,mode,disc,cp);
  return {gross,scgTotal,tigerTotal,cp,disc,net:t.total,vat:t.vat,t,mode};
}

  <div class="card"><h2>สต็อกคงเหลือ ${pill('ต้นทุน: '+(S.shop.costing==='fifo'?'FIFO ตามล็อต':'ถัวเฉลี่ย'),'info')} <span class="row"><button class="btn sm" data-act="trModal">โอนคลัง</button><button class="btn sm" data-act="issModal">เบิกใช้</button><button class="btn sm" data-act="adjModal">ปรับยอด</button><button class="btn sm" data-go="count">นับสต็อก</button></span></h2>
  <div class="tw"><table><tr><th>สินค้า</th><th>หน่วยหลัก</th>${WHA().map(w=>`<th class="n">${w.name}</th>`).join('')}<th class="n">รวม</th>${perm('data.cost')?'<th class="n">ต้นทุน/หน่วย</th><th class="n">มูลค่า</th>':''}<th></th></tr>
  ${STK().map(p=>{const t=stockTotal(p.id);return `<tr><td>${p.name} ${p.scg?pill('SCG','acc'):''}</td><td>${p.units[0].u}${p.units.length>1?`<div class="small muted">${p.units.slice(1).map(u=>`1 ${u.u} = ${fq(u.f)} ${p.units[0].u}`).join(' · ')}</div>`:''}</td>${WHA().map(w=>`<td class="n">${fq(S.stock[p.id][w.id])}</td>`).join('')}<td class="n"><b>${fq(t)}</b></td>${perm('data.cost')?`<td class="n">${fmt(costOf(p.id))}</td><td class="n">${fmt(stockValue(p.id))}</td>`:''}<td><div class="row" style="flex-wrap:nowrap">${t<p.min?pill('ต่ำกว่าจุดสั่งซื้อ','warn'):''}<button class="btn sm" data-lots="${p.id}">ล็อต ${lotsOf(p.id).length}</button></div></td></tr>`;}).join('')}
  </table></div></div>
  ${S.pendingAdj.length?`<div class="card"><h2>รออนุมัติปรับยอด ${pill(S.pendingAdj.length+' รายการ','warn')}</h2><div class="tw"><table><tr><th>ที่มา</th><th>สินค้า</th><th>คลัง</th><th class="n">ผลต่าง</th><th>เหตุผล</th><th></th></tr>${S.pendingAdj.map((a,i)=>`<tr><td>${a.src}</td><td>${P(a.pid).name}</td><td>${S.wh.find(w=>w.id===a.wh).name}</td><td class="n" style="color:${a.q<0?'var(--bad)':'var(--ok)'}">${a.q>0?'+':''}${fq(a.q)}</td><td>${a.reason}<div class="small muted">${a.by?'ขอโดย '+a.by:''}</div></td><td>${perm('inv.adjApprove')===1?`<div class="row"><button class="btn sm pri" data-apv="${i}">อนุมัติ</button><button class="btn sm bad" data-rej="${i}">ไม่อนุมัติ</button></div>`:pill('รอผู้จัดการ/เจ้าของอนุมัติ','warn')}</td></tr>`).join('')}</table></div><p class="small muted">ปุ่มอนุมัติแสดงเฉพาะบทบาทที่มีสิทธิ์ "อนุมัติปรับยอด"</p></div>`:''}
  <div class="card"><h2>ความเคลื่อนไหวล่าสุด (stock ledger)</h2><div class="tw"><table><tr><th>วันที่</th><th>เอกสาร</th><th>สินค้า</th><th>คลัง</th><th class="n">จำนวน</th>${perm('data.cost')?'<th class="n">ทุน/หน่วย</th>':''}<th>หมายเหตุ</th><th>โดย</th><th></th></tr>
  ${S.ledger.map(l=>`<tr><td>${th(l.d)}</td><td class="mono">${l.doc}</td><td>${P(l.pid).name}</td><td>${S.wh.find(w=>w.id===l.wh).name}</td><td class="n" style="color:${l.q<0?'var(--bad)':'var(--ok)'}">${l.q>0?'+':''}${fq(l.q)}</td>${perm('data.cost')?`<td class="n">${l.cost!=null?fmt(l.cost):''}</td>`:''}<td class="small">${l.note}</td><td class="small">${l.by||'-'}</td><td><button class="btn sm" data-pl="${l.doc}">พิมพ์</button></td></tr>`).join('')}</table></div></div>`;

/* ---- Count (M06) ---- */
VIEWS.count=()=>{
  S.cnts=S.cnts||{wh:posWh(),hide:true,vals:{},checked:false};const c=S.cnts;if(!perm('inv.seeSys'))c.hide=true;
  return `<div class="card"><h2>นับสต็อก <span class="row"><button class="btn sm" data-act="printCount">พิมพ์ใบนับ</button><select id="cntWh">${WHA().map(w=>`<option value="${w.id}" ${w.id===c.wh?'selected':''}>${w.name}</option>`).join('')}</select><label class="row small"><input type="checkbox" id="cntHide" ${c.hide?'checked':''} ${perm('inv.seeSys')?'':'disabled'}> ซ่อนยอดตามระบบระหว่างนับ</label></span></h2>
  <div class="row" style="margin-bottom:10px"><input type="text" id="cntScan" placeholder="สแกนบาร์โค้ด เพื่อนับเพิ่มทีละ 1" style="flex:1;min-width:200px"></div>
  <div class="tw"><table><tr><th>สินค้า</th><th>หน่วย</th>${c.hide&&!c.checked?'':'<th class="n">ตามระบบ</th>'}<th class="n">นับได้</th>${c.checked?'<th class="n">ผลต่าง</th>':''}</tr>
  ${STK().map(p=>{const sys=S.stock[p.id][c.wh];const v=c.vals[p.id];const diff=v==null?null:v-sys;return `<tr><td>${p.name}</td><td>${p.units[0].u}</td>${c.hide&&!c.checked?'':`<td class="n">${fq(sys)}</td>`}<td class="n"><input class="qty" type="number" min="0" data-cv="${p.id}" value="${v??''}" placeholder="-"></td>${c.checked?`<td class="n">${diff==null?'<span class="muted">ยังไม่นับ</span>':diff===0?pill('ตรง','ok'):`<b style="color:${diff<0?'var(--bad)':'var(--ok)'}">${diff>0?'+':''}${fq(diff)}</b>`}</td>`:''}</tr>`;}).join('')}
  </table></div>
  <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-act="cntCheck">ตรวจผลต่าง</button><button class="btn pri" data-act="cntSubmit" ${c.checked?'':'disabled'}>ส่งผลต่างให้เจ้าของร้านอนุมัติ</button></div></div>`;
};
AFTER.count=()=>{
  const c=S.cnts;document.getElementById('cntWh').onchange=e=>{c.wh=e.target.value;c.vals={};c.checked=false;render();};
  document.getElementById('cntHide').onchange=e=>{c.hide=e.target.checked;render();};
  document.querySelectorAll('[data-cv]').forEach(i=>i.onchange=()=>{c.vals[i.dataset.cv]=i.value===''?null:+i.value;});
  const sc=document.getElementById('cntScan');sc.onkeydown=e=>{if(e.key==='Enter'){const p=S.products.find(p=>p.bc&&p.bc===sc.value.trim());if(p){c.vals[p.id]=(c.vals[p.id]||0)+1;toast(p.name+' นับได้ '+c.vals[p.id]);render();document.getElementById('cntScan').focus();}else toast('ไม่พบบาร์โค้ดนี้');}};
};

/* ---- Master (M03) ---- */

  if(t==='wh')body=`<div class="row" style="justify-content:space-between;margin:12px 0"><span class="small muted">คลังที่สร้างจะใช้ได้ทันทีในหน้ารับของ โอนคลัง เบิก นับสต็อก และใบส่งของ · POS ตัดสต็อกจากคลังที่ตั้งเป็น "คลังขายหน้าร้าน"</span><button class="btn sm pri" data-act="newWh">+ สร้างคลัง</button></div>
   <div class="tw"><table><tr><th>รหัส</th><th>ชื่อคลัง</th><th>ประเภท</th><th>สาขา</th><th>ตำแหน่ง</th><th class="n">จำนวนสินค้าที่มีของ</th><th class="n">มูลค่าสต็อก</th><th>สถานะ</th><th></th></tr>${S.wh.map((w,i)=>{const items=STK().filter(p=>(S.stock[p.id][w.id]||0)>0);const val=S.lots.filter(l=>l.wh===w.id&&l.q>0).reduce((a,l)=>a+l.q*(S.shop.costing==='fifo'?l.cost:P(l.pid).cost),0);return `<tr><td class="mono small">${w.id}</td><td>${w.name} ${w.pos?pill('คลังขายหน้าร้าน','acc'):''}</td><td>${w.type||'-'}</td><td class="small">${w.branch||'-'}</td><td class="small">${w.loc||'-'}</td><td class="n">${items.length}</td><td class="n">${perm('data.cost')?fmt(val):'-'}</td><td>${w.active!==false?pill('ใช้งาน','ok'):pill('ปิดใช้งาน','mut')}</td><td><button class="btn sm" data-whe="${i}">แก้ไข</button></td></tr>`;}).join('')}</table></div>`;
  if(t==='cat')body=`<div class="row" style="margin:12px 0"><input type="text" id="newCat" placeholder="ชื่อหมวดหมู่ใหม่ เช่น เครื่องมือช่าง"><button class="btn sm pri" data-act="addCat">+ เพิ่มหมวดหมู่</button></div><div class="tw"><table><tr><th>หมวดหมู่</th><th class="n">จำนวนสินค้า</th><th>สินค้า SCG ในหมวด</th></tr>${S.cats.map(c=>{const ps=S.products.filter(p=>p.cat===c);return `<tr><td>${c}</td><td class="n">${ps.length}</td><td class="small">${ps.filter(p=>p.scg).map(p=>p.name).join(', ')||'-'}</td></tr>`;}).join('')}</table></div><p class="small muted">หมวดหมู่ใช้กรองสินค้าในหน้า POS และในรายงาน สินค้า SCG ได้หมวดหมู่ตั้งต้นจาก master ของ Prompt Plus ร้านย้ายหมวดได้</p>`;
  if(t==='cust')body=`<div class="row" style="justify-content:space-between;margin:12px 0"><span class="small muted">ช่องข้อมูลตรงกับ template ผู้ติดต่อของ PEAK: ประเภทกิจการ ที่อยู่แยกช่อง สาขา 5 หลัก เงื่อนไขชำระ 4 แบบ วงเงิน บัญชีธนาคาร และผู้ติดต่อหลายคน</span><button class="btn sm pri" data-ctn="cust">+ เพิ่มลูกค้า</button></div><div class="tw"><table><tr><th>รหัส</th><th>ชื่อ / ที่อยู่</th><th>ประเภทกิจการ</th><th>กลุ่มราคา</th><th>เลขผู้เสียภาษี · สาขา</th><th>เงื่อนไขชำระ</th><th class="n">วงเงิน</th><th>ผู้ติดต่อ</th><th></th></tr>${S.customers.map((c,i)=>`<tr><td class="mono small">${c.code||'-'}</td><td>${c.name}${c.addr?`<div class="small muted">${esc(c.addr)}</div>`:''}</td><td class="small">${c.ent||'-'}</td><td>${S.groups[c.grp].name}</td><td class="mono small">${c.tax||'-'}${c.tax&&c.br?' · '+c.br:''}</td><td class="small">${termLabel(c.term)}</td><td class="n">${c.lmode==='none'?'<span class="small muted">ไม่กำหนด</span>':fmt(c.limit)+(c.lmode==='default'?'<div class="small muted">ค่าเริ่มต้น</div>':'')}</td><td class="small">${(c.contacts||[]).map(x=>x.name).join(', ')||'-'}</td><td><button class="btn sm" data-cte="cust|${i}">แก้ไข</button></td></tr>`).join('')}</table></div>`;
  if(t==='vend')body=`<div class="row" style="justify-content:space-between;margin:12px 0"><span class="small muted">ผู้แทนจำหน่ายใน Prompt Plus สร้างอัตโนมัติ · ผู้จำหน่ายอื่นร้านสร้างเอง · เงื่อนไขชำระฝั่งเจ้าหนี้ใช้ 4 แบบเดียวกัน</span><button class="btn sm pri" data-ctn="vend">+ เพิ่มผู้จำหน่าย</button></div><div class="tw"><table><tr><th>รหัส</th><th>ชื่อ / ที่อยู่</th><th>ที่มา</th><th>เลขผู้เสียภาษี · สาขา</th><th>เงื่อนไขชำระ</th><th>บัญชีธนาคาร</th><th></th></tr>${S.vendors.map((v,i)=>`<tr><td class="mono small">${v.code||'-'}</td><td>${v.name}${v.addr?`<div class="small muted">${esc(v.addr)}</div>`:''}</td><td>${v.pp?pill('ผู้แทนจำหน่ายใน Prompt Plus','acc'):pill('ร้านสร้างเอง','mut')}</td><td class="mono small">${v.tax||'-'}${v.tax&&v.br?' · '+v.br:''}</td><td class="small">${termLabel(v.term)}</td><td class="small">${v.bank&&v.bank.acc?v.bank.bank+' '+v.bank.acc:'-'}</td><td><button class="btn sm" data-cte="vend|${i}">แก้ไข</button></td></tr>`).join('')}</table></div>`;
  if(t==='rsn')body=`<p class="small muted" style="margin:12px 0">ตัวเลือกเหตุผลที่ขึ้นให้เลือกตอนยกเลิกเอกสาร รับคืน คืนผู้ขาย เบิก โอน และปรับยอด · ทุกที่มีตัวเลือก "อื่น ๆ (ระบุเอง)" ให้พิมพ์เพิ่มเสมอ และติ๊กเก็บเป็นตัวเลือกถาวรได้</p><div class="grid g2">${Object.entries(RK).map(([k,l])=>`<div class="card" style="margin:0"><h2 style="font-size:14px">${l}</h2><div class="tw"><table>${S.reasons[k].map((x,i)=>`<tr><td>${esc(x)}</td><td style="width:1%"><button class="btn sm bad" data-rsd="${k}|${i}" aria-label="ลบ ${esc(x)}">✕</button></td></tr>`).join('')}<tr><td class="muted small">อื่น ๆ (ระบุเอง) · มีเสมอ</td><td></td></tr></table></div><div class="row" style="margin-top:8px"><input type="text" id="rsIn_${k}" placeholder="เพิ่มเหตุผล" style="flex:1;min-width:120px"><button class="btn sm" data-rsa="${k}">+ เพิ่ม</button></div></div>`).join('')}</div>`;
  if(t==='price')body=`<p class="small muted" style="margin-top:12px">ราคาตั้งต้นคิดเป็น % จากราคาปลีก และกำหนดราคาเฉพาะรายสินค้าได้ (ราคามีวันเริ่ม-สิ้นสุด)</p><div class="tw"><table><tr><th>สินค้า</th><th>หน่วย</th>${Object.values(S.groups).map(g=>`<th class="n">${g.name}</th>`).join('')}</tr>${S.products.map(p=>`<tr><td>${p.name}</td><td>${p.units[0].u}</td>${Object.keys(S.groups).map(k=>`<td class="n">${fmt(unitPrice(p,0,k))}</td>`).join('')}</tr>`).join('')}</table></div>`;
  if(t==='tax')body=`<div class="grid g2" style="margin-top:12px"><div><h4 style="margin:0 0 6px">รหัสภาษี</h4><table><tr><th>รหัส</th><th>คำอธิบาย</th><th class="n">อัตรา</th></tr><tr><td class="mono">V7</td><td>VAT 7% (เอกสารเลือกได้: ราคารวม / ไม่รวม VAT)</td><td class="n">7%</td></tr><tr><td class="mono">V0</td><td>VAT 0%</td><td class="n">0%</td></tr><tr><td class="mono">EX</td><td>ยกเว้นภาษี</td><td class="n">-</td></tr></table>
  <h4 style="margin:12px 0 6px">หัก ณ ที่จ่าย</h4><table><tr><th>รหัส</th><th>ประเภท</th><th class="n">อัตรา</th></tr><tr><td class="mono">W1</td><td>ค่าขนส่ง</td><td class="n">1%</td></tr><tr><td class="mono">W3</td><td>ค่าบริการ/รับเหมา</td><td class="n">3%</td></tr></table></div>
  <div><h4 style="margin:0 0 6px">ผูกรหัสบัญชีสำหรับส่งออก (GL mapping)</h4><table><tr><th>รายการ</th><th>เลขบัญชี</th></tr>${[['ซื้อสินค้า / สินค้าคงเหลือ (ค่าตั้งต้นของสินค้า)',S.shop.gl.buy],['รายได้ขาย (ค่าตั้งต้นของสินค้า)',S.shop.gl.sale],['ต้นทุนขาย (ค่าตั้งต้นของสินค้า)',S.shop.gl.cogs],['ลูกหนี้การค้า (ค่าตั้งต้นของลูกค้า)',S.shop.gl.ar],['เจ้าหนี้การค้า (ค่าตั้งต้นของผู้จำหน่าย)',S.shop.gl.ap],['ภาษีขาย','215101'],['ภาษีซื้อ','115101'],['เงินมัดจำรับ','217101'],['ส่วนลดคูปอง SCG Family','410901']].map(([a,b])=>`<tr><td>${a}</td><td><input type="text" value="${b}" style="width:110px" aria-label="เลขบัญชี ${a}"></td></tr>`).join('')}</table><p class="small muted">นักบัญชีของร้านกรอกเลขบัญชีให้ตรงกับโปรแกรมบัญชีที่ใช้ ไฟล์ส่งออกจึงนำเข้าได้ทันที</p></div></div>`;
  return `<div class="card"><div class="tabs">${tabs.map(([k,l])=>`<button data-mt="${k}" class="${t===k?'on':''}">${l}</button>`).join('')}</div>${body}</div>`;

function saveContact(){ceSync();const c=S.ce;const isC=c.kind==='cust';const list=isC?S.customers:S.vendors;const err=m=>{document.getElementById('ceErr').textContent=m;};
  const ind=c.ent==='บุคคลธรรมดา';const name=ind?`${c.prefix||''}${c.fname||''} ${c.lname||''}`.trim():(c.name||'').trim();
  if(!name||(ind&&!(c.fname||'').trim())){err('ใส่ชื่อก่อนบันทึก');return;}
  if(c.tax&&c.nat==='ไทย'&&!/^\d{13}$/.test(c.tax)){err('เลขประจำตัวผู้เสียภาษีต้องเป็นตัวเลข 13 หลัก');return;}
  if(!ind&&c.br&&!/^\d{5}$/.test(c.br)){err('สาขาต้องเป็นตัวเลข 5 หลัก เช่น 00000 = สำนักงานใหญ่');return;}
  if(c.ra.zip&&!/^\d{5}$/.test(c.ra.zip)){err('รหัสไปรษณีย์ต้องเป็นตัวเลข 5 หลัก');return;}
  const tm=c.term.t==='days'||c.term.t==='nextDay'?{t:c.term.t,x:+c.term.x||0}:{t:c.term.t};
  if(tm.t==='nextDay'&&!(tm.x>=1&&tm.x<=31)){err('วันที่ของเดือนถัดไปต้องอยู่ระหว่าง 1–31');return;}
  if(tm.t==='days'&&tm.x<0){err('จำนวนวันต้องไม่ติดลบ');return;}
  const pre=isC?'C':'V';let code=(c.code||'').trim();if(code&&list.some((x,j)=>j!==c.i&&x.code===code)){err('รหัส '+code+' ซ้ำ');return;}
  if(!code){let n=list.length;do{code=pre+String(n++).padStart(5,'0');}while(list.some(x=>x.code===code));}
  const {kind,i,...rest}=c;const obj={...rest,code,name,term:tm,contacts:c.contacts.filter(x=>(x.name||'').trim())};
  if(isC){obj.limit=c.lmode==='none'?0:c.lmode==='default'?S.shop.defLimit:(+c.limit||0);}
  obj.addr=fullAddr(c.ra);
  const prev=i==null?null:list[i];const dtxt=prev?diffs([['ชื่อ',prev.name,obj.name],['เลขผู้เสียภาษี',prev.tax,obj.tax],['สาขา',prev.br,obj.br],['ที่อยู่',prev.addr,obj.addr],['เงื่อนไขชำระ',termLabel(prev.term),termLabel(obj.term)],['วงเงิน',prev.limit,obj.limit],['กลุ่มราคา',prev.grp,obj.grp],['โทร',prev.phone,obj.phone],['ผู้ติดต่อ',(prev.contacts||[]).map(x=>x.name).join(','),obj.contacts.map(x=>x.name).join(',')]]):'';
  if(i==null){obj.id=pre.toLowerCase()+(list.length+(isC?0:1));while(list.some(x=>x.id===obj.id))obj.id+='x';list.push(obj);}else Object.assign(list[i],obj);
  logA(i==null?'เพิ่ม':'แก้ไข',isC?'ลูกค้า':'ผู้จำหน่าย',code,i==null?name:(dtxt||'ไม่มีการเปลี่ยนแปลง'));
  S.ce=null;closeModal();toast((i==null?'เพิ่ม ':'บันทึก ')+name+' แล้ว · รหัส '+code);render();}

    const csv=[...head,...rows].map(r=>r.map(v=>{v=String(v??'');return /[,"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;}).join(',')).join('\n');
    S.exportHist.unshift({d:TODAY,tpl,per:'ข้อมูลหลัก ณ '+th(TODAY),rows:rows.length});logA('ส่งออก',tpl,'',rows.length+' แถว');
    document.getElementById('exOut').innerHTML=`<div class="note" style="margin-top:12px">สร้างไฟล์ ${tpl} แล้ว · ${rows.length} แถว ${head[1].length} คอลัมน์ หัวตาราง 2 แถวตรงกับ template ของ PEAK · ${files} ไฟล์ (PEAK แนะนำไม่เกิน 1,000 แถวต่อไฟล์ ระบบแบ่งให้อัตโนมัติ)${isP?' · สินค้าที่มีหลายล็อตใส่ลำดับที่ซ้ำ แถวละ 1 ล็อต':' · ผู้ติดต่อที่มีหลายคนใส่ลำดับที่ซ้ำ แถวละ 1 คน'}</div><textarea id="exTxt" rows="9" style="width:100%;margin-top:8px;font-family:var(--mono);font-size:12px" readonly>${esc(csv)}</textarea><button class="btn sm" data-act="copyExport" style="margin-top:6px">คัดลอก</button>`;return;}
  const inv=S.docs.filter(d=>d.type==='INV'&&live(d));
  const head=tpl==='Express'?'DOCNUM,DOCDAT,CUSCOD,AMOUNT,VATAMT,NETAMT':tpl==='FlowAccount'?'documentSerial,publishedOn,contactName,subTotal,vatAmount,grandTotal':tpl==='PEAK'?'เลขที่เอกสาร,วันที่,ผู้ติดต่อ,มูลค่าก่อนภาษี,ภาษี,ยอดรวม':tpl.startsWith('Journal')?'วันที่,เลขที่,บัญชี,เดบิต,เครดิต':'เลขที่,วันที่,ลูกค้า,ก่อนVAT,VAT,รวม';
  const rows=tpl.startsWith('Journal')?inv.slice(0,3).flatMap(d=>{const t=docTax(d);return [[th(d.date),d.no,d.credit?S.shop.gl.ar:'111101',fmt(t.total),''],[th(d.date),d.no,S.shop.gl.sale,'',fmt(t.base7+t.exempt)],...(t.vat?[[th(d.date),d.no,'215101','',fmt(t.vat)]]:[])];}):inv.map(d=>{const t=docTax(d);return [d.no,th(d.date),C(d.cust).name,fmt(t.base7+t.exempt),fmt(t.vat),fmt(t.total)];});
  const csv=[head,...rows.map(r=>r.map(v=>/[,"]/.test(v)?`"${v}"`:v).join(','))].join('\n');
  S.exportHist.unshift({d:TODAY,tpl,per,rows:rows.length});logA('ส่งออก',doc+' · '+tpl,'',per+' · '+rows.length+' แถว');
  document.getElementById('exOut').innerHTML=`<div class="note" style="margin-top:12px">สร้างไฟล์ ${doc} รูปแบบ ${tpl} (${rows.length} แถว) แล้ว ในระบบจริงจะได้ไฟล์ดาวน์โหลด ที่นี่แสดงตัวอย่างเนื้อหา</div><textarea id="exTxt" rows="8" style="width:100%;margin-top:8px;font-family:var(--mono);font-size:12px" readonly>${esc(csv)}</textarea><button class="btn sm" data-act="copyExport" style="margin-top:6px">คัดลอก</button>`;
}

function voidCheck(d){if(d.void)return 'เอกสารนี้ยกเลิกไปแล้ว';if(d.type==='INV'&&d.credit&&(d.paid||0)>0)return 'รับชำระไปแล้ว ยกเลิกไม่ได้ ให้ทำใบลดหนี้ / รับคืนสินค้าแทน';

function reverseStock(d,ref){const wh=d.wh||(d.type==='DO'?'WH2':posWh());(d.lines||[]).forEach(l=>{if(l.bundle){(l.comps||[]).forEach(a=>stockIn(a.pid,wh,a.q,a.q?(a.cogs||0)/a.q:costOf(a.pid),ref,'คืนสต็อก · ยกเลิก '+d.no));return;}

  ${short.length?`<div class="note bad small">วัตถุดิบไม่พอ: ${short.map(x=>P(x.pid).name).join(', ')} · ลดจำนวนผลิต หรือรับวัตถุดิบเข้าก่อน</div>`:''}

function estTax(m,sso){const y=m*12;const inc=y-Math.min(y*.5,100000)-60000-sso*12;const B=[[150000,0],[300000,.05],[500000,.1],[750000,.15],[1000000,.2],[2000000,.25],[5000000,.3],[Infinity,.35]];let t=0,lo=0;for(const [hi,r] of B){if(inc>lo)t+=(Math.min(inc,hi)-lo)*r;lo=hi;}return Math.round(Math.max(0,t)/12);}
function payRow(e,mon){const inp=((S.payIn[mon]||{})[e.id])||{};const daily=e.type==='รายวัน'||e.type==='พาร์ทไทม์';const days=inp.days!=null?+inp.days:26;const base=daily?(e.daily||0)*days:(e.salary||0);
  const unpaid=S.leaves.filter(l=>l.emp===e.id&&l.type==='unpaid'&&l.status==='อนุมัติ'&&l.from.slice(0,7)===mon).reduce((a,l)=>a+l.days,0);const unpaidAmt=daily?0:r2(unpaid*(e.salary||0)/30);
  const commBase=e.comm?S.docs.filter(d=>live(d)&&d.type==='INV'&&d.by===e.name&&d.date.slice(0,7)===mon).reduce((a,d)=>{const t=docTax(d);return a+t.base7+t.exempt;},0):0;const comm=r2(commBase*(e.comm||0)/100);
  const ot=+inp.ot||0,allow=+inp.allow||0,adv=+inp.adv||0;const gross=r2(base+ot+allow+comm-unpaidAmt);const sso=e.ss?Math.round(Math.min(Math.max(gross,1650),S.shop.ssoCap||17500)*.05):0;const tax=inp.tax!=null&&inp.tax!==''?+inp.tax:estTax(gross,sso);
  return {eid:e.id,code:e.code,name:e.name,pos:e.pos,type:e.type,bank:e.bank,daily,days,base:r2(base),ot,allow,comm,commBase:r2(commBase),unpaid,unpaidAmt,gross,sso,tax,adv,net:r2(gross-sso-tax-adv)};}
function payRows(mon){const pr=S.payroll[mon];if(pr&&pr.status==='จ่ายแล้ว'){if(!pr.rows)pr.rows=payStaff().map(e=>payRow(e,mon));return pr.rows;}return payStaff().map(e=>payRow(e,mon));}

   ...(r.sso?[{name:'หักประกันสังคม 5%',amt:-r.sso}]:[]),...(r.tax?[{name:'หักภาษี ณ ที่จ่าย (ภ.ง.ด.1)',amt:-r.tax}]:[]),...(r.adv?[{name:'หักเงินเบิกล่วงหน้า',amt:-r.adv}]:[])],
  totals:[['รวมเงินได้',fmt(r.gross)],['รวมรายการหัก','−'+fmt(r.sso+r.tax+r.adv)],['เงินได้สุทธิ',fmt(r.net),1]],baht:bahtText(r.net),sign:['ผู้จ่ายเงิน','ผู้รับเงิน']};}

function saveEmp(){const g=k=>document.getElementById(k);const id=document.querySelector('[data-act=saveEmp]').dataset.id;const err=t=>{g('emErr').textContent=t;};const old=id?S.emps.find(x=>x.id===id):null;const ou=old?userOf(old.id):null;
  const name=g('emN').value.trim(),uname=g('emU').value.trim().toLowerCase();if(!name){err('ใส่ชื่อพนักงาน');return;}
  if(!old){if(!/^[a-z0-9._]{3,20}$/.test(uname)){err('ชื่อผู้ใช้ 3–20 ตัว ใช้ a–z 0–9 . _');return;}if(S.users.some(u=>u.user===uname)){err('ชื่อผู้ใช้ '+uname+' มีแล้ว (รวมพนักงานที่ลาออก) ใช้ชื่ออื่น');return;}}
  const type=g('emT').value;const e=old||{id:'e'+(S.emps.length+1),status:'ทำงาน'};const before=old?JSON.parse(JSON.stringify(old)):null;
  Object.assign(e,{name,pos:g('emP').value.trim(),type,start:g('emS').value,tel:g('emTel').value.trim(),bank:g('emB').value.trim(),leave:{sick:+g('emL1').value||0,personal:+g('emL2').value||0,vac:+g('emL3').value||0}});
  if(g('emSal')){e.salary=+g('emSal').value||0;e.daily=+g('emD').value||0;e.comm=+g('emCm').value||0;e.ss=g('emSS').checked;}
  if(!old){e.code=g('emC').value.trim()||((type==='บุคคลภายนอก'?'EXT':'EMP')+String(S.emps.length+1).padStart(3,'0'));S.emps.push(e);S.users.push({name,role:g('emR').value,last:'-',emp:e.id,user:uname,utype:g('emUT').value,active:true,tel:e.tel});
    logA('เพิ่ม','พนักงาน + ผู้ใช้',e.code,name+' · '+e.pos+' · ผู้ใช้ '+uname+' ('+S.roles[g('emR').value].name+')');}
  else{const nr=g('emR').value;const d=diffs([['ชื่อ',before.name,e.name],['ตำแหน่ง',before.pos,e.pos],['ประเภท',before.type,e.type],['บทบาท',S.roles[ou.role].name,S.roles[nr].name],['สิทธิ์ลา',JSON.stringify(before.leave),JSON.stringify(e.leave)]]);const sc=before.salary!==e.salary||before.daily!==e.daily||before.comm!==e.comm?' · แก้ค่าจ้าง':'';
    ou.name=name;ou.role=nr;ou.utype=g('emUT').value;logA('แก้ไข','พนักงาน',e.code,(d||'')+sc||'ไม่มีการเปลี่ยนแปลง');}
  closeModal();toast(old?'บันทึกพนักงานแล้ว':'เพิ่มพนักงานและผู้ใช้ '+uname+' แล้ว');render();}

const RK={void:'ยกเลิกเอกสาร',ret:'รับคืนจากลูกค้า',pret:'คืนสินค้าผู้ขาย',iss:'เบิกใช้สินค้า',adj:'ปรับยอดสต็อก',tr:'โอนคลัง'};
function reasonField(kind,id,cur,oth,label){const L=S.reasons[kind];const isO=cur==='__o';return `<label class="f">${label||'เหตุผล'}<select id="${id}" data-rsk="${id}">${L.map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('')}<option value="__o" ${isO?'selected':''}>อื่น ๆ (ระบุเอง)</option></select></label>
  <label class="f" id="${id}Wrap" style="${isO?'':'display:none'}">ระบุเหตุผล *<input type="text" id="${id}O" value="${esc(oth||'')}" placeholder="พิมพ์เหตุผล"><span class="row small" style="margin-top:4px;gap:6px"><input type="checkbox" id="${id}S" style="width:auto"> เก็บเป็นตัวเลือกไว้ใช้ครั้งหน้า</span></label>`;}
function getReason(kind,id){const el=document.getElementById(id);if(!el)return '';if(el.value!=='__o')return el.value;const o=document.getElementById(id+'O');const t=(o.value||'').trim();if(!t){toast('เลือก "อื่น ๆ" แล้ว ต้องพิมพ์เหตุผลก่อน');o.focus();return null;}
  if(document.getElementById(id+'S').checked&&!S.reasons[kind].includes(t)){S.reasons[kind].push(t);logA('เพิ่ม','ตัวเลือกเหตุผล ('+RK[kind]+')','',t);}return t;}

function stockFormModal(kind){if(!S.sf||S.sf.kind!==kind)S.sf={kind,wh:kind==='tr'?'WH2':'WH2',wh2:'WH1',lines:[{pid:STK()[0].id,u:0,q:kind==='adj'?-1:1}],reason:S.reasons[kind][0],reasonO:'',note:''};const m=S.sf;
  const T={tr:'โอนสินค้าระหว่างคลัง',iss:'เบิกใช้สินค้า',adj:'ขอปรับยอดสต็อก'}[kind];const base=l=>l.q*P(l.pid).units[l.u||0].f;
  const used={};m.lines.forEach(l=>{used[l.pid]=(used[l.pid]||0)+base(l);});
  modal(`<h3>${T}</h3><p class="small muted" style="margin:0">ใส่ได้หลายสินค้าในใบเดียว · สแกนบาร์โค้ดเพื่อเพิ่มแถวได้ · ${kind==='adj'?'ใส่ + เพื่อเพิ่ม หรือ − เพื่อลด ทุกแถวต้องรอเจ้าของร้านอนุมัติก่อนสต็อกเปลี่ยน':kind==='tr'?'ล็อตย้ายไปพร้อมวันที่และต้นทุนเดิม':'ตัดล็อตเก่าก่อน (FIFO)'}</p>
  <div class="fgrid"><label class="f">${kind==='tr'?'จากคลัง':'คลัง'}<select id="sfW">${WHA().map(w=>`<option value="${w.id}" ${w.id===m.wh?'selected':''}>${w.name}</option>`).join('')}</select></label>
   ${kind==='tr'?`<label class="f">ไปคลัง<select id="sfW2">${WHA().map(w=>`<option value="${w.id}" ${w.id===m.wh2?'selected':''}>${w.name}</option>`).join('')}</select></label>`:''}
   ${reasonField(kind,'sfR',m.reason,m.reasonO,kind==='tr'?'เหตุผลการโอน':'เหตุผล')}
   <label class="f">หมายเหตุ<input type="text" id="sfN" value="${esc(m.note)}" placeholder="${kind==='iss'?'เช่น ใช้ซ่อมหลังคาร้าน':'ไม่บังคับ'}"></label></div>
  <div class="row"><input type="text" id="sfScan" placeholder="สแกน / พิมพ์บาร์โค้ด แล้วกด Enter เพื่อเพิ่มแถว" style="flex:1;min-width:200px"></div>
  <div class="tw"><table><tr><th>#</th><th>สินค้า</th><th>หน่วย</th><th class="n">${kind==='adj'?'ปรับ + / −':'จำนวน'}</th><th class="n">คงเหลือในคลัง</th><th class="n">${kind==='tr'?'ต้นทาง':''}หลังทำรายการ</th><th></th></tr>
  ${m.lines.map((l,i)=>{const p=P(l.pid);const av=S.stock[p.id][m.wh]||0;const after=kind==='adj'?av+base(l):av-used[p.id];const bad=kind!=='adj'&&(l.q<=0||used[p.id]>av+1e-9)||kind==='adj'&&(!l.q||after<0);
   return `<tr><td>${i+1}</td><td><select data-sfp="${i}" aria-label="สินค้าแถว ${i+1}">${STK().map(x=>`<option value="${x.id}" ${x.id===l.pid?'selected':''}>${x.name}</option>`).join('')}</select></td>
   <td><select data-sfu="${i}" aria-label="หน่วย">${p.units.map((u,k)=>`<option value="${k}" ${k===(l.u||0)?'selected':''}>${u.u}</option>`).join('')}</select></td>
   <td class="n"><input class="qty" type="number" step="any" data-sfq="${i}" value="${l.q}" aria-label="จำนวนแถว ${i+1}"></td><td class="n">${fq(av)} ${p.units[0].u}</td><td class="n" style="${bad?'color:var(--bad);font-weight:600':''}">${fq(after)}${bad?'<div class="small">'+(kind==='adj'?(l.q?'ติดลบไม่ได้':'ใส่จำนวน'):'เกินคงเหลือ')+'</div>':''}</td>
   <td>${m.lines.length>1?`<button class="btn sm bad" data-sfrm="${i}" aria-label="ลบแถว">✕</button>`:''}</td></tr>`;}).join('')}</table></div>
  <div class="row"><button class="btn sm" data-act="sfAdd">+ เพิ่มสินค้า</button><span class="small muted">${m.lines.length} รายการ</span></div>

  const sync=()=>{const g=id=>document.getElementById(id);m.wh=g('sfW').value;if(g('sfW2'))m.wh2=g('sfW2').value;m.reason=g('sfR').value;m.reasonO=g('sfRO').value;m.note=g('sfN').value;};S.sfSync=sync;
  ['sfW','sfW2'].forEach(id=>{const e=document.getElementById(id);if(e)e.onchange=()=>{sync();stockFormModal(kind);};});
  ['sfR','sfRO','sfN'].forEach(id=>{const e=document.getElementById(id);if(e)e.addEventListener('change',sync);});
  document.querySelectorAll('[data-sfp]').forEach(e=>e.onchange=()=>{sync();m.lines[+e.dataset.sfp]={pid:e.value,u:0,q:m.lines[+e.dataset.sfp].q};stockFormModal(kind);});
  document.querySelectorAll('[data-sfu]').forEach(e=>e.onchange=()=>{sync();m.lines[+e.dataset.sfu].u=+e.value;stockFormModal(kind);});
  document.querySelectorAll('[data-sfq]').forEach(e=>e.onchange=()=>{sync();m.lines[+e.dataset.sfq].q=+e.value||0;stockFormModal(kind);});
  const sc=document.getElementById('sfScan');sc.onkeydown=ev=>{if(ev.key!=='Enter')return;const p=S.products.find(x=>x.bc&&x.bc===sc.value.trim()&&isStk(x));if(!p){toast('ไม่พบบาร์โค้ดนี้');return;}sync();const ex=m.lines.find(l=>l.pid===p.id&&!l.u);if(ex)ex.q=r2(ex.q+(kind==='adj'&&ex.q<0?-1:1));else m.lines.push({pid:p.id,u:0,q:kind==='adj'?-1:1});stockFormModal(kind);setTimeout(()=>{const x=document.getElementById('sfScan');if(x)x.focus();},0);};}
function stockFormOk(kind){const m=S.sf;S.sfSync();const R=getReason(kind,'sfR');if(R===null)return;const why=R+(m.note?' · '+m.note:'');const base=l=>r2(l.q*P(l.pid).units[l.u||0].f);
  const used={};m.lines.forEach(l=>{used[l.pid]=(used[l.pid]||0)+base(l);});
  if(kind==='tr'&&m.wh===m.wh2){toast('เลือกคลังปลายทางที่ต่างจากต้นทาง');return;}
  if(kind!=='adj'){const bad=m.lines.find(l=>l.q<=0)||Object.keys(used).find(pid=>used[pid]>(S.stock[pid][m.wh]||0)+1e-9);if(bad){toast('มีแถวที่จำนวนเป็น 0 หรือเกินคงเหลือในคลังต้นทาง');return;}}
  else if(m.lines.some(l=>!l.q||(S.stock[l.pid][m.wh]||0)+base(l)<0)){toast('มีแถวที่ยังไม่ใส่จำนวน หรือปรับแล้วติดลบ');return;}
  const sum=m.lines.map(l=>P(l.pid).name.split(' ')[0]+' '+(kind==='adj'&&l.q>0?'+':'')+fq(l.q)+' '+P(l.pid).units[l.u||0].u).join(', ');
  if(kind==='tr'){const no=next('TR');m.lines.forEach(l=>stockMove(l.pid,m.wh,m.wh2,base(l),no));logA('เพิ่ม','ใบโอนสินค้า',no,whName(m.wh)+' → '+whName(m.wh2)+' · '+m.lines.length+' รายการ · '+sum+' · '+why);toast(no+' โอน '+m.lines.length+' รายการแล้ว');S.sf=null;closeModal();render();printModal(pStockDoc(no));return;}
  if(kind==='iss'){const no=next('ADJ');m.lines.forEach(l=>stockOut(l.pid,m.wh,base(l),no,'เบิก: '+why));logA('เพิ่ม','ใบเบิกสินค้า',no,whName(m.wh)+' · '+m.lines.length+' รายการ · '+sum+' · '+why);toast(no+' เบิก '+m.lines.length+' รายการแล้ว');S.sf=null;closeModal();render();printModal(pStockDoc(no));return;}
  const rq='RQ-'+String(S.pendingAdj.length+S.ledger.length).padStart(4,'0');m.lines.forEach(l=>S.pendingAdj.push({src:'คำขอ '+rq,pid:l.pid,wh:m.wh,q:base(l),reason:why,by:curUser().name}));
  logA('ขออนุมัติ','ปรับยอดสต็อก',rq,whName(m.wh)+' · '+m.lines.length+' รายการ · '+sum+' · '+why);S.sf=null;closeModal();toast('ส่งขออนุมัติ '+m.lines.length+' รายการแล้ว');render();}

/* ---------- pagination for every list (client side in mockup; server side + cursor in the real system) ---------- */
const PG_SIZES=[10,20,50,100],PG_DEF=20;
const skeleton=()=>`<div class="card" aria-busy="true" aria-label="กำลังโหลด"><div class="small muted">กำลังโหลดข้อมูล…</div>${'<div class="sk"></div>'.repeat(3)}<div class="sk" style="width:60%"></div></div><div class="card">${'<div class="sk"></div>'.repeat(6)}</div>`;
const pgRows=tb=>[...tb.rows].filter(r=>!r.querySelector('th')&&!r.dataset.keep&&!r.querySelector('td.empty')&&!r.classList.contains('grp'));
function paginateTables(){S.pg=S.pg||{};const tabs=[S.masterTab,S.hrTab,S.logTab,S.prodTab,S.salesFilter,S.admTab,S.pjI,S.importMode].join(',');
  [...document.querySelectorAll('#view table')].forEach((tb,ti)=>{if(tb.closest('.paper')||tb.classList.contains('perm'))return;const rows=pgRows(tb);if(rows.length<=PG_DEF)return;
    const key=S.view+'|'+tabs+'|'+ti;tb.dataset.pgk=key;S.pg[key]=S.pg[key]||{p:1,size:PG_DEF,q:''};const host=tb.closest('.tw')||tb;const pg=document.createElement('div');pg.className='pager';pg.dataset.pgk=key;host.after(pg);applyPage(tb);});}
function applyPage(tb,keepFocus){const key=tb.dataset.pgk;const st=S.pg[key];const rows=pgRows(tb);const q=(st.q||'').trim().toLowerCase();const match=q?rows.filter(r=>r.textContent.toLowerCase().includes(q)):rows;
  const pages=Math.max(1,Math.ceil(match.length/st.size));st.p=Math.min(Math.max(1,st.p),pages);const a=(st.p-1)*st.size,b=a+st.size;rows.forEach(r=>{r.style.display='none';});match.forEach((r,i)=>{if(i>=a&&i<b)r.style.display='';});
  const nums=[];for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-st.p)<=1)nums.push(i);else if(nums[nums.length-1]!=='…')nums.push('…');}
  const pg=[...document.querySelectorAll('.pager')].find(x=>x.dataset.pgk===key);if(!pg)return;
  pg.innerHTML=`<span class="small muted">${match.length?`แสดง ${fq(a+1)}–${fq(Math.min(b,match.length))} จาก ${fq(match.length)} รายการ`:'ไม่พบรายการที่ค้น'}${q?' (กรองจาก '+fq(rows.length)+')':''}</span>
   <span class="row" style="gap:4px"><input type="search" data-pgq value="${esc(st.q||'')}" placeholder="ค้นในรายการนี้" style="width:150px" aria-label="ค้นในรายการนี้"><select data-pgs aria-label="จำนวนต่อหน้า">${PG_SIZES.map(z=>`<option value="${z}" ${z===st.size?'selected':''}>${z} / หน้า</option>`).join('')}</select>
   <button class="btn sm" data-pgp="first" ${st.p<=1?'disabled':''} aria-label="หน้าแรก">«</button><button class="btn sm" data-pgp="prev" ${st.p<=1?'disabled':''} aria-label="หน้าก่อน">‹</button>${nums.map(n=>n==='…'?'<span class="small muted">…</span>':`<button class="btn sm ${n===st.p?'on':''}" data-pgp="${n}" aria-label="หน้า ${n}" ${n===st.p?'aria-current="page"':''}>${n}</button>`).join('')}<button class="btn sm" data-pgp="next" ${st.p>=pages?'disabled':''} aria-label="หน้าถัดไป">›</button><button class="btn sm" data-pgp="last" ${st.p>=pages?'disabled':''} aria-label="หน้าสุดท้าย">»</button></span>`;
  if(keepFocus){const i=pg.querySelector('[data-pgq]');i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
function pgGo(el,fn){const pg=el.closest('.pager');const key=pg.dataset.pgk;const tb=[...document.querySelectorAll('table')].find(x=>x.dataset.pgk===key);const st=S.pg[key];fn(st);const host=tb.closest('.tw')||tb;host.classList.add('pgload');
  setTimeout(()=>{host.classList.remove('pgload');applyPage(tb);},S.bigData?220:90);}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.pgq!=null){clearTimeout(pgGo.t);pgGo.t=setTimeout(()=>{const pg=t.closest('.pager');if(!pg)return;const key=pg.dataset.pgk;S.pg[key].q=t.value;S.pg[key].p=1;const tb=[...document.querySelectorAll('table')].find(x=>x.dataset.pgk===key);applyPage(tb,true);},250);}});

  if(t.dataset.tf){const [i,k]=t.dataset.tf.split('|');S.tenants[+i].feat[k]=t.checked?1:0;toast((t.checked?'เปิด ':'ปิด ')+FEATS.find(f=>f[0]===k)[1]+' ให้ '+S.tenants[+i].name);return;}
  if(t.dataset.csrp!=null){S.central[+t.dataset.csrp].srp=+t.value||0;S.central[+t.dataset.csrp].ws=Math.round((+t.value||0)*.93*100)/100;render();return;}
  if(t.dataset.cmode!=null){S.central[+t.dataset.cmode].mode=t.value;return;}
  if(t.id==='persona'){logA('ออกจากระบบ','ระบบ','','สลับผู้ใช้ (mockup)');S.persona=t.value;logA('เข้าสู่ระบบ','ระบบ','','สลับผู้ใช้ (mockup)');closeModal();S.view=canView(S.view)?S.view:firstView();render();toast(isAdmin()?'มุมมองผู้ดูแลระบบ SCG':'ใช้เป็น '+S.users[+t.value].name+' ('+S.roles[S.users[+t.value].role].name+')');return;}
  if(t.dataset.pcat){const p=P(t.dataset.pcat);logA('แก้ไข','สินค้า',p.sku,'หมวด: '+p.cat+' → '+t.value);p.cat=t.value;toast('ย้ายหมวดหมู่แล้ว');return;}
  if(t.dataset.photo&&t.files&&t.files[0]){const p=P(t.dataset.photo);const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const k=Math.min(1,240/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);p.photo=c.toDataURL('image/jpeg',.82);toast('อัปโหลดรูป '+p.name+' แล้ว');render();};im.src=fr.result;};fr.readAsDataURL(t.files[0]);return;}
  if(t.dataset.ldv!=null||t.dataset.ldm!=null){const k=+(t.dataset.ldv??t.dataset.ldm);const l=S.cart[k];const old={dval:l.dval,dmode:l.dmode};if(t.dataset.ldv!=null)l.dval=Math.max(0,+t.value||0);else l.dmode=t.value;
    const pct=lineGross(l)?lineDisc(l)/lineGross(l)*100:0;const cap=perm('pos.discCap');
    if(pct>cap+1e-9){const nv={dval:l.dval,dmode:l.dmode};Object.assign(l,old);render();S.apvFn=()=>{Object.assign(S.cart[k],nv);render();};S.apvLabel='ส่วนลด '+fq(pct)+'% เกินสิทธิ์ '+cap+'% ('+P(l.pid).name+')';
      modal(`<h3>ส่วนลดเกินสิทธิ์</h3><p>บทบาท "${S.roles[curRole()].name}" ให้ส่วนลดได้ไม่เกิน ${cap}% ต่อรายการ รายการนี้ลด ${fq(pct)}%</p><label class="f">ผู้อนุมัติ<select id="apvBy">${S.users.filter(u=>['owner','manager'].includes(u.role)).map(u=>`<option>${u.name}</option>`).join('')}</select></label><label class="f">PIN 4 หลัก (ตัวอย่างใช้ 1234)<input type="text" id="apvPin" inputmode="numeric" maxlength="4"></label><div id="apvErr" class="small" style="color:var(--bad)"></div><div class="act"><button class="btn" data-close>ใช้ส่วนลดเดิม</button><button class="btn pri" data-act="doApprove">อนุมัติส่วนลดนี้</button></div>`);return;}
    render();return;}
  if(t.dataset.ui!=null){const l=S.cart[+t.dataset.ui];l.u=+t.value;applyPromo(l);render();}
  if(t.dataset.qi!=null){const l=S.cart[+t.dataset.qi];l.qty=Math.max(0,+t.value||0);if(!l.qty)S.cart.splice(+t.dataset.qi,1);render();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='lgP'){const b=document.querySelector('[data-act=loginGo]');if(b)b.click();}});
document.getElementById('logoutBtn').onclick=()=>{logA('ออกจากระบบ','ระบบ','','');S.auth=false;try{sessionStorage.removeItem('scgerp-auth');}catch(e){}closeModal();render();};
document.getElementById('menuBtn').onclick=()=>document.getElementById('side').classList.toggle('open');
document.getElementById('resetBtn').onclick=()=>{const v=S.view,pe=S.persona;S=seed();initState();S.view=v;S.persona=pe;S.auth=true;closeModal();render();toast('รีเซ็ตข้อมูลตัวอย่างแล้ว');};
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TITLES[h])go(h);});
render();
window.__erp={get S(){return S;},addCart,confirmPay,posWh,render,isStk};
})();
</script>
